name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://streetlifting:streetlifting@localhost:5432/streetlifting?schema=public
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from `packageManager` in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter=@streetlifting/api db:generate
      - name: Validate Prisma schema
        run: pnpm --filter=@streetlifting/api db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter=@streetlifting/api build
      - run: pnpm --filter=@streetlifting/web build
