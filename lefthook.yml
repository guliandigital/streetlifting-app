# Git hooks via lefthook (https://github.com/evilmartians/lefthook).
# Install once per clone: `pnpm exec lefthook install`.
# See ADR-0004 §"Secrets" and ADR-0003 (lint enforces no-cross-feature imports).

pre-commit:
  parallel: true
  commands:
    gitleaks:
      # Requires gitleaks installed on $PATH:
      #   Windows : winget install gitleaks  (or scoop install gitleaks)
      #   macOS   : brew install gitleaks
      #   Linux   : see https://github.com/gitleaks/gitleaks#installing
      run: gitleaks protect --staged --redact --no-banner
      fail_text: "Secrets detected. Remove them and re-stage. (If gitleaks is not installed, see lefthook.yml.)"
    prettier:
      glob: "*.{ts,tsx,js,json,md,yml,yaml,css,html}"
      run: pnpm exec prettier --check {staged_files}
      fail_text: "Run `pnpm exec prettier --write {staged_files}` and re-stage."
    eslint:
      glob: "*.{ts,tsx,js}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
